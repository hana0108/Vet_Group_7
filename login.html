<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetGroup7 - Iniciar sesión</title>
    <link rel="stylesheet" href="login_style.css">
    <script src="js/app.js"></script>
    <script src="login.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="brand-logo">
            <span class="logo-icon">🐾</span> VetGroup7
        </div>
        <nav class="top-nav">
            <a href="presentacion.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="cuidados.html">Cuidados</a>
            <a href="mascotas.html">Mascotas</a>
            <a href="citas.html">Citas</a>
            <a href="presentacion.html#contacto">Contacto</a>
            <a href="citas.html" class="btn-reservar">Reservar cita</a>
        </nav>
    </header>

    <main class="page-container">
        <div class="card">
            <div class="left-panel">
                <img class="panel-bg-img" src="img/img_login.jpeg" alt="Mascotas VetGroup7">
                <div class="banner-text">
                    <h2>Bienvenido de nuevo a<br><span>VetGroup7</span></h2>
                    <p>Cuida a quienes hacen feliz tu vida.</p>
                </div>
            </div>

            <div class="right-panel">
                <div class="form-container">
                    <h3>Iniciar sesión</h3>
                    <form id="authForm" data-mode="login" action="#" method="POST" novalidate>
                        <div class="form-group">
                            <input id="correoLogin" name="correo" type="email" placeholder="Correo electrónico" autocomplete="username" required>
                        </div>
                        <div class="form-group">
                            <input id="passwordLogin" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn-primary">Ingresar</button>
                    </form>

                    <div class="divider">
                        <span>Acceso de prueba</span>
                    </div>

                    <p class="signup-text">
                        ¿No tienes una cuenta? <a href="regsitro.html">Registrarse</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
